<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shiny App</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
  import { runExportedApp } from "./shinylive/shinylive.js";
  const relPath=((p)=>{const i=p.lastIndexOf("/");return i<=0?"":p.slice(1,i);})(window.location.pathname);
  runExportedApp({ id: "root", appEngine: "python", relPath: relPath || "." });
</script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
  </head>
  <body>
    
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
  </body>
</html>
